
spring.application.name=momo-backend
server.port=8111

spring.datasource.url=jdbc:mysql://localhost:3306/momo_db?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# KOBIS API 설정
kobis.api.key=ac316c308a606656b80fdc5e6f490081
kobis.api.base-url=https://www.kobis.or.kr/kobisopenapi/webservice/rest

# KMDb API 설정
kmdb.api.key=27FR7HIBU2H21H5NATSU
kmdb.api.base-url=http://api.koreafilm.or.kr/openapi-data2/wisenut

# TMDB API 설정
tmdb.api.key=81ab90921f366f46d3cd6ee7ec37331e
tmdb.api.base-url=https://api.themoviedb.org/3

# 외부 영화 API 연결 및 응답 제한 시간
external-api.connect-timeout=3s
external-api.read-timeout=8s

# JWT 설정
# JWT_SECRET 환경 변수에 Base64 인코딩된 서명 키 설정
jwt.secret=${JWT_SECRET:}

# Access Token 유효기간: 30분
jwt.access-exp-ms=${JWT_ACCESS_EXP_MS:1800000}

# Refresh Token 유효기간: 7일
jwt.refresh-exp-ms=${JWT_REFRESH_EXP_MS:604800000}
