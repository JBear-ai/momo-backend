name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Run Gemini Review Script
        env:
          GEMINI_API_KEY: ${{ secrets.GitHub }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python -c "
          import os, requests
          from google import genai

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPO']
          pr_number = os.environ['PR_NUMBER']

          # 1. GitHub API로 PR의 Diff(변경 내용) 가져오기
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github.v3.diff'
          }
          diff_url = f'https://api.github.com/repos/{repo}/pulls/{pr_number}'
          diff_res = requests.get(diff_url, headers=headers)
          code_diff = diff_res.text

          if not code_diff.strip():
              print('변경되거나 리뷰할 코드가 없습니다.')
              exit(0)

          # 2. Gemini 클라이언트 초기화
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])

          # 3. Gemini에게 코드 리뷰 요청 (한글 출력 명시)
          prompt = f'''
          다음은 Git Pull Request의 변경된 코드(Diff)입니다. 이 코드를 검토하고 버그, 보안 취약점, 개선할 점을 간략하고 명확하게 한국어로 리뷰해 주세요.
          모든 답변과 설명은 반드시 한국어로 작성해 주세요.

          {code_diff}
          '''

          try:
              response = client.models.generate_content(
                  model='gemini-3.8-flash',
                  contents=prompt
              )
          except Exception as error:
              # Gemini 무료 티어의 일일 요청 한도(429)는 코드 검토 실패가 아니라
              # 외부 서비스 쿼터 제한이므로 필수 빌드·테스트 결과를 막지 않는다.
              if getattr(error, 'status_code', None) == 429:
                  print('Gemini API quota exceeded (429). AI review is skipped for this run.')
                  exit(0)
              raise

          review_comment = response.text

          # 4. 리뷰 결과를 GitHub PR에 댓글로 등록
          comment_url = f'https://api.github.com/repos/{repo}/issues/{pr_number}/comments'
          comment_headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github.v3+json'
          }
          payload = {
              'body': f'### 🤖 Gemini Code Review\n\n{review_comment}'
          }
          
          res = requests.post(comment_url, headers=comment_headers, json=payload)
          if res.status_code == 201:
              print('리뷰 댓글이 성공적으로 등록되었습니다.')
          else:
              print(f'댓글 등록 실패: {res.status_code}, {res.text}')
          "
