name: MOMO Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/recommend-catalog-3month]

jobs:
  backend:
    name: Backend Gradle Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: momo-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run backend tests
        run: bash ./gradlew test

  frontend:
    name: Frontend Test and Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: momo-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: momo-frontend/yarn.lock
      - name: Activate the project's Yarn version
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run frontend tests
        run: CI=true yarn test --watchAll=false
      - name: Build frontend
        run: yarn build
