name: MOMO Browser E2E

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/autocomplete-saved-posters

concurrency:
  group: momo-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Browser E2E (MySQL + Spring Boot + React)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: momo-e2e-password
          MYSQL_DATABASE: momo_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmomo-e2e-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start Spring Boot against MySQL
        working-directory: momo-backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/momo_db?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
          DB_USERNAME: root
          DB_PASSWORD: momo-e2e-password
          JWT_SECRET: TW9tb1Rlc3RPbmx5U2VjcmV0S2V5Rm9ySlZUVGVzdHMxMjM0NQ==
          MOMO_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
        run: |
          nohup bash ./gradlew bootRun --args="--spring.profiles.active=test --server.port=8111 --momo.catalog.sync.enabled=false --momo.catalog.enrichment.enabled=false --momo.boxoffice.scheduler.enabled=false --momo.poster.retry.enabled=false --momo.poster.migration.enabled=false --momo.catalog.enrichment.delay-ms=86400000 --momo.poster.migration.delay-ms=86400000" > /tmp/momo-backend-e2e.log 2>&1 &
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:8111/api/auth/exists/id/e2e-health-check >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/momo-backend-e2e.log
          exit 1

      - name: Install frontend dependencies
        working-directory: momo-frontend
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile

      - name: Start React frontend
        working-directory: momo-frontend
        env:
          CI: "false"
          BROWSER: none
          PORT: "3000"
          REACT_APP_API_BASE_URL: http://127.0.0.1:8111
        run: |
          nohup yarn start > /tmp/momo-frontend-e2e.log 2>&1 &
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/momo-frontend-e2e.log
          exit 1

      - name: Install Playwright and Chromium
        working-directory: momo-frontend
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: momo-frontend
        run: npx playwright test

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: momo-browser-e2e-evidence
          path: |
            momo-frontend/test-results/
            /tmp/momo-backend-e2e.log
            /tmp/momo-frontend-e2e.log
          if-no-files-found: ignore
